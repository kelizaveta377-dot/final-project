name: FastAPI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4 # Скачиваем весь проект

      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      
      - name: Install application dependencies
        run: |
          pip install --upgrade pip
          if [[ -f "requirements.txt" ]]; then
            echo "Found requirements in root"
            pip install -r requirements.txt
          else
            cd my_service && pip install -r requirements.txt || true
          fi

      
      - name: Install development tools
        run: |
          if [[ -f "requirements-dev.txt" ]]; then
            echo "Found dev deps in root"
            pip install -r requirements-dev.txt
          elif [[ -f "my_service/requirements-dev.txt" ]]; then
            cd my_service && pip install -r requirements-dev.txt
          else
            pip install pytest httpx # Если нет файла
          fi

     
      - name: Run tests
        run: |
          cd my_service && pytest -v || pytest -v # Проверка на наличие кода внутри my_service

     
      - name: Check logs in code
        run: |
          grep -R "print($$" *.py
